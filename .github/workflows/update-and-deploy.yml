name: Update V4 data and deploy Pages
on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai, China does not use DST.
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Refresh prior-trading-day data
        run: python scripts/update_data.py
        continue-on-error: true
      - run: python scripts/validate_snapshot.py
      - name: Commit latest successful/stale status snapshot and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/v4-snapshot.json data-cache || true
          git diff --cached --quiet || git commit -m "data: refresh V4 snapshot"
          git push || true
  deploy:
    needs: [update]
    if: always() && (github.event_name == 'push' || needs.update.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: '.'}
      - id: deployment
        uses: actions/deploy-pages@v4
